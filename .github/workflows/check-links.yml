name: Check Markdown Links

on:
  push:
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --offline "./**/*.md"
